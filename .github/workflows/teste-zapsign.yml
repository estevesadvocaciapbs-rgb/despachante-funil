name: Teste do ZapSign (sandbox)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["zapsign.py", "teste_zapsign_sandbox.py", ".github/workflows/teste-zapsign.yml"]

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes sem internet
        run: python teste_zapsign.py
      - name: Teste no ambiente de teste do ZapSign
        env:
          ZAPSIGN_TOKEN: ${{ secrets.ZAPSIGN_TOKEN }}
          ZAPSIGN_AMBIENTE: sandbox
        run: python teste_zapsign_sandbox.py
