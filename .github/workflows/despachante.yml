name: Despachante do funil

on:
  schedule:
    # Plantão 24 horas. Cada plantão dura até 5h50 e confere a Za.Ia a cada 60 s.
    # O disparo é de hora em hora: enquanto um plantão roda, o próximo fica na fila
    # e entra assim que o anterior termina (sem buraco entre eles).
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      simulacao:
        description: "Só simular uma rodada (não envia nada)"
        type: boolean
        default: true

concurrency:
  group: despachante
  cancel-in-progress: false

jobs:
  despachar:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar despachante
        env:
          ZAIA_TOKEN: ${{ secrets.ZAIA_TOKEN }}
          EASYJUR_TOKEN: ${{ secrets.EASYJUR_TOKEN }}
          TELEFONES_EQUIPE: ${{ secrets.TELEFONES_EQUIPE }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.simulacao }}" = "true" ]; then
            python despachante.py --dry-run
          else
            python despachante.py --vigia
          fi
