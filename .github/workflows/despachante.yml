name: Despachante do funil

on:
  schedule:
    # Plantão 24 horas. Cada plantão dura até 5h50 e confere a Za.Ia a cada 60 s.
    # Ao terminar (ou falhar), o próprio plantão chama o próximo; o "Vigia do plantão"
    # religa se o GitHub derrubar tudo. Este agendamento é só mais uma garantia.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      simulacao:
        description: "Só simular uma rodada (não envia nada)"
        type: boolean
        default: true

concurrency:
  group: despachante
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  despachar:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar despachante
        env:
          ZAIA_TOKEN: ${{ secrets.ZAIA_TOKEN }}
          EASYJUR_TOKEN: ${{ secrets.EASYJUR_TOKEN }}
          TELEFONES_EQUIPE: ${{ secrets.TELEFONES_EQUIPE }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.simulacao }}" = "true" ]; then
            python despachante.py --dry-run
          else
            python despachante.py --vigia
          fi
      - name: Chamar o próximo plantão
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.simulacao) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run despachante.yml --repo "${{ github.repository }}" -f simulacao=false
