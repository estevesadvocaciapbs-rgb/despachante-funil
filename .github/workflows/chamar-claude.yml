name: Gravar sinal para o Claude (teste manual)

# Grava agora o sinal.json (ramo "sinal"), como o porteiro faz sozinho quando chega
# pedido novo de advogado. Serve para testar se as rotinas do Claude acordam.
# O sinal leva só a hora; nenhum dado de cliente.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sinal:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gravar sinal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -c "import porteiro, sys; sys.exit(0 if porteiro.chamar_claude() else 1)"
